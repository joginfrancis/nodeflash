; nodeflash gateway (ESP32-S3). USB serial <-> RS-485 for updating node firmware.
; Normally flashed with "nodeflash gateway-flash", which uses the prebuilt
; ../../bin/gateway/gateway-esp32s3.bin. Rebuild with: pio run
; Pins and bus speed can be changed with build flags (GW_TX_PIN, GW_RX_PIN,
; GW_DE_PIN, BUS_BAUD_HZ).

[env:gateway]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
monitor_speed = 460800
lib_deps = symlink://../../nodeflash-lib
build_flags =
	-DGW_TX_PIN=17
	-DGW_RX_PIN=18
	-DGW_DE_PIN=4
