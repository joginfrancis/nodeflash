; nodeflash bootloader for STM32G070RB nodes. Bare metal: no Arduino, no HAL.
; Occupies the first 8 KB of flash. One build per node ID (boot01 ... boot20);
; the ID is the only difference. Normally flashed with "nodeflash factory",
; which uses the prebuilt files in ../../bin/bootloader/.
;   Build all:   pio run
;   Console:     ST-Link COM port, 115200

[platformio]
default_envs = boot01

[env]
platform = ststm32@20.0.0
board = nucleo_g070rb
upload_protocol = stlink
extra_scripts = pre:scripts/stlink_transport.py
board_build.ldscript = boot.ld
build_flags =
	-DSTM32G070xx
	-I../../nodeflash-lib/src
	-Icmsis
	-Os
	-fno-exceptions
	-fno-rtti
	-nostartfiles

[env:boot01]
build_flags = ${env.build_flags} -DNODE_ID=1

[env:boot02]
build_flags = ${env.build_flags} -DNODE_ID=2

[env:boot03]
build_flags = ${env.build_flags} -DNODE_ID=3

[env:boot04]
build_flags = ${env.build_flags} -DNODE_ID=4

[env:boot05]
build_flags = ${env.build_flags} -DNODE_ID=5

[env:boot06]
build_flags = ${env.build_flags} -DNODE_ID=6

[env:boot07]
build_flags = ${env.build_flags} -DNODE_ID=7

[env:boot08]
