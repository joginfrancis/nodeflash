; nodeflash example application (STM32G070RB). Linked at
; 0x08002000, above the 8 KB bootloader. Normally sent over RS-485 by the
; gateway with "nodeflash update", not uploaded with the ST-Link.
;   Build both:  pio run
;   Images:      .pio/build/app_v1/firmware.bin, .pio/build/app_v2/firmware.bin

[env]
platform = ststm32@20.0.0
platform_packages = platformio/framework-arduinoststm32@4.21200.0
board = nucleo_g070rb
framework = arduino
upload_protocol = stlink
extra_scripts = pre:scripts/stlink_transport.py
board_build.f_cpu = 64000000L
board_build.flash_offset = 0x2000
board_upload.offset_address = 0x08002000
; nodeflash: shared packet/boot headers and nodeflash_client.h
lib_deps = symlink://../../nodeflash-lib
build_flags =
	-DHSE_VALUE=16000000UL
	-DNODE_ID=1

[env:app_v1]
build_flags = ${env.build_flags} -DAPP_VERSION=1

[env:app_v2]
build_flags = ${env.build_flags} -DAPP_VERSION=2
