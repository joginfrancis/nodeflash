name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest
      - run: python -m pytest -q
      - run: python -m nodeflash check firmware/bin/example_app/app_v1.bin firmware/bin/example_app/app_v2.bin

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Build bootloader, gateway and example app
        run: |
          (cd firmware/src/bootloader && pio run -e boot01 -e boot20)
          (cd firmware/src/gateway && pio run)
          (cd firmware/src/example_app && pio run)
