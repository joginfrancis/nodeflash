[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nodeflash"
version = "1.0.0"
description = "Program and update STM32 nodes on an RS-485 bus through an ESP32 host"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5", "esptool>=4.7"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
nodeflash = "nodeflash.cli:main"

[tool.setuptools]
packages = ["nodeflash"]
